<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>guadaware</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="statusbar">
    <span>●●●●○ guadaware</span>
    <span class="sb-center" id="status-time"></span>
    <span id="status-battery">100% 🔋</span>
  </header>

  <main id="homescreen"></main>

  <footer id="dock"></footer>

  <div id="lockscreen">
    <div id="lock-clock">
      <div id="lock-time"></div>
      <div id="lock-date"></div>
    </div>

    <div id="slider">
      <div id="slide-text">slide to unlock</div>
      <div id="knob">›</div>
    </div>
  </div>

  <script src="js/App.js"></script>
  <script src="js/lockscreen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
