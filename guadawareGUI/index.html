<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>guadaware</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: #000;
      user-select: none;
    }

    #statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 6px 16px 0;
      background: linear-gradient(to bottom, rgb(180, 180, 180), white);
      color: black;
      font-size: 15px;
      font-weight: 600;
    }

    #frame-wrap {
      position: relative;
      flex: 1;
    }

    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    #gesture-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: grab;
    }

    #gesture-bar span {
      width: 134px;
      height: 5px;
      border-radius: 2.5px;
      background: #fff;
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <header id="statusbar">
    <span id="status-time"></span>
    <span id="status-battery">100%</span>
  </header>

  <main id="frame-wrap">
    <iframe id="app-frame" src="apps/lockscreen/" title="app"></iframe>
    <footer id="gesture-bar"><span></span></footer>
  </main>

  <script>
    const frame = document.getElementById("app-frame");
    const clock = document.getElementById("status-time");
    const batteryLabel = document.getElementById("status-battery");

    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12 || 12;
      const minutes = String(now.getMinutes()).padStart(2, "0");
      clock.textContent = `${hours}:${minutes}`;
      checkBatterySafety();
    }

    function checkBatterySafety() {
      const text = batteryLabel.textContent;
      const value = parseInt(text, 10);
      if (!isNaN(value) && value < 4) {
        fetch("http://localhost:8080/poweroff", { mode: "no-cors" }).catch(() => {});
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    const SYSTEM_API = "http://localhost:8080";

    function updateBatteryFromOS() {
      fetch(`${SYSTEM_API}/getBatteryPercentage`, { mode: "no-cors" })
        .then((res) => res.text())
        .then((text) => {
          if (text) batteryLabel.textContent = `${text}%`;
        })
        .catch(() => {});
    }

    updateBatteryFromOS();
    setInterval(updateBatteryFromOS, 30000);

    if (navigator.getBattery) {
      navigator.getBattery().then((battery) => {
        function updateBattery() {
          batteryLabel.textContent = `${Math.round(battery.level * 100)}%`;
        }
        updateBattery();
        battery.addEventListener("levelchange", updateBattery);
      });
    }

    const gestureBar = document.getElementById("gesture-bar");
    let startY = null;
    let startTime = null;

    gestureBar.addEventListener("pointerdown", (event) => {
      gestureBar.setPointerCapture(event.pointerId);
      startY = event.clientY;
      startTime = performance.now();
    });

    gestureBar.addEventListener("pointerup", (event) => {
      if (startY === null) return;
      const dy = event.clientY - startY;
      const dt = performance.now() - startTime;
      const speed = dy / dt;
      if (dy < -40 && speed < -0.4) {
        frame.src = "apps/homescreen/";
      }
      startY = null;
      startTime = null;
    });

    gestureBar.addEventListener("pointercancel", () => {
      startY = null;
      startTime = null;
    });
  </script>
</body>
</html>
