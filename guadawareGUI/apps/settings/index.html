<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
</head>
<body>
    <header>
        <h1>Settings</h1>
    </header>
    <main>
        

        <section>
            <ul>
                <li>
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23ff9500'/><path d='M10.7 2.6c0-.7.6-1.3 1.3-1.3s1.3.6 1.3 1.3v5.6l7.2 4.3v2.1l-7.2-2.3v4.9l1.9 1.4v1.7L12 19.6l-2.2.7v-1.7l1.9-1.4v-4.9L4.5 14.6v-2.1l7.2-4.3z' fill='%23fff'/></svg>" alt="">
                    Airplane Mode
                    <label><input id="airplane-toggle" type="checkbox"><span></span></label>
                </li>
                <li>
                    <a href="wifi.html">
                        <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23007aff'/><g fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'><path d='M3.5 9.8C8.4 5.4 15.6 5.4 20.5 9.8'/><path d='M6.3 13.2c3.2-2.9 8.2-2.9 11.4 0'/><path d='M9.2 16.5c1.6-1.4 4-1.4 5.6 0'/></g><circle cx='12' cy='19.6' r='1.7' fill='%23fff'/></svg>" alt="">
                        Wi-Fi
                        <b></b>
                    </a>
                </li>
                <li>
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%233478f6'/><path d='M6.5 7.5 17 16.5 12 20.5V3.5l5 4-10.5 9' fill='none' stroke='%23fff' stroke-width='1.9' stroke-linejoin='round' stroke-linecap='round'/></svg>" alt="">
                    Bluetooth
                    <label><input type="checkbox"><span></span></label>
                </li>
                <li>
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2334c759'/><g fill='%23fff'><rect x='4.5' y='13' width='3.4' height='7' rx='1'/><rect x='10.3' y='9' width='3.4' height='11' rx='1'/><rect x='16.1' y='5' width='3.4' height='15' rx='1'/></g></svg>" alt="">
                    Cellular Data
                    <label><input id="cellular-toggle" type="checkbox"><span></span></label>
                </li>
            </ul>
        </section>

        <section>
            <ul>
                
                <li>
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23ff2d55'/><path d='M4 9.3v5.4h3.4L12 18.4V5.6L7.4 9.3H4z' fill='%23fff'/><path d='M15 9.2a4 4 0 0 1 0 5.6M17.4 7a7 7 0 0 1 0 10' fill='none' stroke='%23fff' stroke-width='1.9' stroke-linecap='round'/></svg>" alt="">
                    Sounds
                    <label><input type="checkbox"><span></span></label>
                </li>
                <li>
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%235e5ce6'/><path d='M19.6 14.3A8 8 0 0 1 9.7 4.4 8 8 0 1 0 19.6 14.3z' fill='%23fff'/></svg>" alt="">
                    Do Not Disturb
                    <label><input type="checkbox"><span></span></label>
                </li>
            </ul>
        </section>

        <section>
            <ul>
                <li>
                    <a href="aboutguadafon.html">
                        <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%238e8e93'/><circle cx='12' cy='12' r='6.4' fill='none' stroke='%23fff' stroke-width='2.6' stroke-dasharray='3 2.02'/><circle cx='12' cy='12' r='3.1' fill='%23fff'/></svg>" alt="">
                        About your Guadafón
                    </a>
                </li>
                <li>
                    <a href="wallpaperpicker.html">
                        <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2332ade6'/><rect x='4.5' y='6' width='15' height='12' rx='2' fill='none' stroke='%23fff' stroke-width='1.8'/><circle cx='9.2' cy='10' r='1.5' fill='%23fff'/><path d='M6.5 16.5 10 13l2.6 2.6 2.4-2.4 2.5 2.5' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>" alt="">
                        Wallpaper
                    </a>
                </li>
            </ul>
        </section>
    </main>
    <script>
      const SYSTEM_API = "http://localhost:8080";
      const airplaneToggle = document.getElementById("airplane-toggle");
      const cellularToggle = document.getElementById("cellular-toggle");

      function setAirplaneMode(on) {
        fetch(`${SYSTEM_API}/setAirplanemode/${on ? 1 : 0}`, { mode: "no-cors" }).catch(() => {});
        localStorage.setItem("airplanemode", on ? "1" : "0");
      }

      function setCellularData(on) {
        fetch(`${SYSTEM_API}/setCellularDataStatus/${on ? 1 : 0}`, { mode: "no-cors" }).catch(() => {});
        localStorage.setItem("cellulardata", on ? "1" : "0");
      }

      fetch(`${SYSTEM_API}/getAirplanemode`, { mode: "no-cors" })
        .then((res) => res.text())
        .then((text) => {
          airplaneToggle.checked = text === "1";
        })
        .catch(() => {});

      fetch(`${SYSTEM_API}/getCellularDataStatus`, { mode: "no-cors" })
        .then((res) => res.text())
        .then((text) => {
          cellularToggle.checked = text === "1";
        })
        .catch(() => {});

      airplaneToggle.addEventListener("change", () => {
        setAirplaneMode(airplaneToggle.checked);
      });

      cellularToggle.addEventListener("change", () => {
        setCellularData(cellularToggle.checked);
      });
    </script>
</body>
</html>
