<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/index.css" />
    <script src="../../guadawareUniversalFramework/Locale.js"></script>
    <script>
      new Locale();
    </script>
    <script src="index.js"></script>
  </head>

  <body>
    <!-- calculation area where numbers/operations
        will be displayed and also their results -->
    <div class="cal-area">
      <p id="result-str">
        <span class="normal">0</span><span class="superscript"></span>
      </p>
      <p class="answer-row">
        <span id="savedAnswer">0</span>
        <span id="answer">0</span>
      </p>
    </div>
    <!-- scientific buttons -->
    <div class="scientific-area">
      <button id="sin" class="scientific-btn">sin</button>
      <button id="cos" class="scientific-btn">cos</button>
      <button id="tan" class="scientific-btn">tan</button>
      <button id="log" class="scientific-btn">log</button>
      <button id="ln" class="scientific-btn">ln</button>
      <button id="sqrt" class="scientific-btn">&radic;</button>
      <button id="cbrt" class="scientific-btn">&#8731;</button>
      <button id="x-pow-y" class="scientific-btn">x<sup>y</sup></button>
      <button id="squared" class="scientific-btn">x<sup>2</sup></button>
      <button id="cubbed" class="scientific-btn">x<sup>3</sup></button>
    </div>
    <!-- calculator buttons -->
    <div class="cal-btns">
      <div class="left-area">
        <button id="clear" class="left-btn">C</button>
        <button id="percent" class="left-btn">%</button>
        <button id="del" class="left-btn" data-locale="calc.del">del</button>
        <button
          class="num left-btn"
          value="7"
          onclick="typed(value, '#result-str .normal')"
        >
          7
        </button>
        <button
          class="num left-btn"
          value="8"
          onclick="typed(value, '#result-str .normal')"
        >
          8
        </button>
        <button
          class="num left-btn"
          value="9"
          onclick="typed(value, '#result-str .normal')"
        >
          9
        </button>
        <button
          class="num left-btn"
          value="4"
          onclick="typed(value, '#result-str .normal')"
        >
          4
        </button>
        <button
          class="num left-btn"
          value="5"
          onclick="typed(value, '#result-str .normal')"
        >
          5
        </button>
        <button
          class="num left-btn"
          value="6"
          onclick="typed(value, '#result-str .normal')"
        >
          6
        </button>
        <button
          class="num left-btn"
          value="1"
          onclick="typed(value, '#result-str .normal')"
        >
          1
        </button>
        <button
          class="num left-btn"
          value="2"
          onclick="typed(value, '#result-str .normal')"
        >
          2
        </button>
        <button
          class="num left-btn"
          value="3"
          onclick="typed(value, '#result-str .normal')"
        >
          3
        </button>
        <button
          class="num left-btn"
          value="00"
          onclick="typed(value, '#result-str .normal')"
        >
          00
        </button>
        <button
          class="num left-btn"
          value="0"
          onclick="typed(value, '#result-str .normal')"
        >
          0
        </button>
        <button
          class="num left-btn"
          value="."
          onclick="typed(value, '#result-str .normal')"
        >
          .
        </button>
      </div>
      <div class="right-area">
        <button
          class="right-btn"
          value="/"
          onclick="typed(value, '#result-str .normal')"
        >
          ÷
        </button>
        <button
          class="right-btn"
          value="*"
          onclick="typed(value, '#result-str .normal')"
        >
          ×
        </button>
        <button
          class="right-btn"
          value="-"
          onclick="typed(value, '#result-str .normal')"
        >
          -
        </button>
        <button
          class="right-btn"
          value="+"
          onclick="typed(value, '#result-str .normal')"
        >
          +
        </button>
        <button id="equal-btn" class="right-btn">=</button>
      </div>
    </div>
  </body>
</html>
