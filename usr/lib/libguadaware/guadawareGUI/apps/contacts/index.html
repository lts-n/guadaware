<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Contacts</title>
  <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="contacts-header">
    <h1 id="contacts-title" data-locale="contacts.title">Contacts</h1>
    <button id="btn-add" aria-label="Add Contact">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </header>

  <div id="search-bar">
    <input type="text" id="search-input" data-locale-placeholder="contacts.search" placeholder="Search">
  </div>

  <main id="contacts-content">
    <div id="contacts-list"></div>
    <div id="contacts-empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <p data-locale="contacts.empty">No contacts yet</p>
    </div>
  </main>

  <div id="contact-form" class="hidden">
    <header id="form-header">
      <button id="btn-cancel" data-locale="contacts.cancel">Cancel</button>
      <h2 id="form-title" data-locale="contacts.newcontact">New Contact</h2>
      <button id="btn-save" data-locale="contacts.save">Save</button>
    </header>
    <div id="form-avatar">
      <div id="avatar-circle"></div>
    </div>
    <div id="form-fields">
      <input type="text" id="field-name" data-locale-placeholder="contacts.name" placeholder="Name">
      <input type="tel" id="field-phone" data-locale-placeholder="contacts.phone" placeholder="Phone">
      <input type="email" id="field-email" data-locale-placeholder="contacts.email" placeholder="Email">
      <textarea id="field-notes" data-locale-placeholder="contacts.notes" placeholder="Notes" rows="3"></textarea>
    </div>
  </div>

  <div id="contact-detail" class="hidden">
    <header id="detail-header">
      <button id="btn-back-list">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button id="btn-delete" data-locale="contacts.delete">Delete</button>
    </header>
    <div id="detail-content">
      <div id="detail-avatar"></div>
      <h2 id="detail-name"></h2>
      <div id="detail-actions">
        <button id="btn-edit" class="action-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          <span data-locale="contacts.edit">Edit</span>
        </button>
      </div>
      <div id="detail-info">
        <div class="info-section">
          <label data-locale="contacts.phone">Phone</label>
          <p id="detail-phone"></p>
        </div>
        <div class="info-section">
          <label data-locale="contacts.email">Email</label>
          <p id="detail-email"></p>
        </div>
        <div class="info-section">
          <label data-locale="contacts.notes">Notes</label>
          <p id="detail-notes"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../../guadawareUniversalFramework/Locale.js"></script>
  <script src="index.js"></script>
</body>
</html>
