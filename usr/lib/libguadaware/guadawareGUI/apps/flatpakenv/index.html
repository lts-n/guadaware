<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatpak environment</title>
    <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
</head>
<body>
    <header>
        <h1 data-locale="flatpakenv.title">Flatpak environment</h1>
    </header>
    <main>
        <section>
            <ul>
                <li>
                    <input type="search" id="search-input" data-locale-placeholder="flatpakenv.searchapps" placeholder="Search for apps" style="border:none;background:rgba(142,142,147,0.18);border-radius:6px;font-size:17px;width:100%;outline:none;height:36px;padding:0 8px;">
                </li>
            </ul>
        </section>

        <section id="search-results" style="display:none;">
            <h2 data-locale="flatpakenv.search">Search Flathub</h2>
            <ul id="search-list"></ul>
        </section>

        <h2 data-locale="flatpakenv.installed">Installed Apps</h2>
        <section>
            <ul id="applist">
                <li data-locale="flatpakenv.loading">Loading…</li>
            </ul>
        </section>
    </main>

    <dialog id="action-dialog">
        <h1 id="dialog-title"></h1>
        <p id="dialog-message"></p>
        <form id="dialog-form"></form>
    </dialog>

    <script src="../../guadawareUniversalFramework/Locale.js"></script>
    <script>
        const locale = new Locale();
        const SYSTEM_API = "http://localhost:8080";

        const searchInput = document.getElementById("search-input");
        const applist = document.getElementById("applist");
        const searchResults = document.getElementById("search-results");
        const searchList = document.getElementById("search-list");
        const actionDialog = document.getElementById("action-dialog");
        const dialogTitle = document.getElementById("dialog-title");
        const dialogMessage = document.getElementById("dialog-message");
        const dialogForm = document.getElementById("dialog-form");

        let installedApps = [];
        let searchTimeout = null;

        function makeMessage(name, message) {
            dialogTitle.textContent = name;
            dialogMessage.textContent = message;
            dialogForm.innerHTML = "";
        }

        function addDialogButton(text, color, onClick) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = text;
            if (color) btn.style.color = color;
            btn.addEventListener("click", onClick);
            dialogForm.appendChild(btn);
        }

        function closeDialog() {
            actionDialog.close();
        }

        function sanitizeAppId(id) {
            return String(id).replace(/[^A-Za-z0-9._-]/g, "");
        }

        async function loadInstalledApps() {
            applist.innerHTML = `<li>${locale.t("flatpakenv.loading")}</li>`;
            try {
                const res = await fetch(`${SYSTEM_API}/sh/${encodeURIComponent("flatpak list --app --columns=application,name")}`);
                const text = await res.text();
                installedApps = [];
                text.split("\n").forEach((line) => {
                    if (!line.trim()) return;
                    const pieces = line.trim().split(/\s{2,}|\t+/);
                    const id = pieces[0];
                    if (!id || !id.includes(".")) return;
                    installedApps.push({
                        id: id,
                        name: pieces[1] || id
                    });
                });
            } catch (e) {
                installedApps = [];
            }
            renderInstalledApps();
        }

        function renderInstalledApps() {
            applist.innerHTML = "";
            if (installedApps.length === 0) {
                const li = document.createElement("li");
                li.textContent = locale.t("flatpakenv.noinstalled");
                applist.appendChild(li);
                return;
            }
            installedApps.forEach((app) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#";
                const wrap = document.createElement("div");
                wrap.style.cssText = "flex:1;overflow:hidden;min-width:0";
                const nameSpan = document.createElement("span");
                nameSpan.textContent = app.name || app.id;
                const idDiv = document.createElement("div");
                idDiv.style.cssText = "font-size:13px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
                idDiv.textContent = app.id;
                wrap.appendChild(nameSpan);
                wrap.appendChild(idDiv);
                a.appendChild(wrap);
                li.appendChild(a);
                li.addEventListener("click", (e) => {
                    e.preventDefault();
                    showInstalledDialog(app);
                });
                applist.appendChild(li);
            });
        }

        function showInstalledDialog(app) {
            makeMessage(app.name || app.id, app.id);
            addDialogButton(locale.t("flatpakenv.open"), "", () => {
                closeDialog();
                openApp(app.id);
            });
            addDialogButton(locale.t("flatpakenv.remove"), "var(--red)", () => {
                closeDialog();
                showRemoveConfirm(app);
            });
            addDialogButton(locale.t("flatpakenv.cancel"), "", closeDialog);
            actionDialog.showModal();
        }

        function showRemoveConfirm(app) {
            makeMessage(app.name || app.id, locale.t("flatpakenv.confirmremove"));
            addDialogButton(locale.t("flatpakenv.remove"), "var(--red)", async () => {
                closeDialog();
                applist.innerHTML = `<li>${locale.t("flatpakenv.removing")}</li>`;
                const error = await runFlatpakCommand("flatpak uninstall -y " + sanitizeAppId(app.id));
                if (error) {
                    showDialogMessage(app.name || app.id, error);
                }
                await loadInstalledApps();
            });
            addDialogButton(locale.t("flatpakenv.cancel"), "", closeDialog);
            actionDialog.showModal();
        }

        function showInstallDialog(app) {
            makeMessage(app.name || app.id, app.id);
            addDialogButton(locale.t("flatpakenv.install"), "", async () => {
                closeDialog();
                applist.innerHTML = `<li>${locale.t("flatpakenv.installing")}</li>`;
                const error = await runFlatpakCommand("flatpak install -y flathub " + sanitizeAppId(app.id));
                if (error) {
                    showDialogMessage(app.name || app.id, error);
                }
                await loadInstalledApps();
                if (searchInput.value.trim()) {
                    await runSearch(searchInput.value);
                }
            });
            addDialogButton(locale.t("flatpakenv.cancel"), "", closeDialog);
            actionDialog.showModal();
        }

        async function runFlatpakCommand(cmd) {
            try {
                const res = await fetch(`${SYSTEM_API}/sh/${encodeURIComponent(cmd)}`);
                const text = await res.text();
                const lowered = text.trim().toLowerCase();
                if (lowered.includes("error:") || lowered.includes("failed") || lowered.includes("not found") || lowered.includes("denied")) {
                    return text.trim().split("\n")[0] || "error";
                }
                return null;
            } catch (e) {
                return String(e);
            }
        }

        function showDialogMessage(title, message) {
            makeMessage(title, message);
            addDialogButton(locale.t("flatpakenv.ok"), "", closeDialog);
            actionDialog.showModal();
        }

        function openApp(appId) {
            fetch(`${SYSTEM_API}/sh/${encodeURIComponent("nohup flatpak run " + sanitizeAppId(appId) + " >/dev/null 2>&1 &")}`).catch(() => {});
        }

        async function runSearch(query) {
            const value = query.trim();
            if (!value) {
                searchResults.style.display = "none";
                return;
            }
            searchResults.style.display = "block";
            searchList.innerHTML = `<li>${locale.t("flatpakenv.loading")}</li>`;
            const safeQuery = value.replace(/'/g, "'\\''");
            try {
                const res = await fetch(`${SYSTEM_API}/sh/${encodeURIComponent("flatpak search --columns=application,name,description '" + safeQuery + "'")}`);
                const text = await res.text();
                renderSearchResults(text);
            } catch (e) {
                searchList.innerHTML = `<li>${locale.t("flatpakenv.noresults")}</li>`;
            }
        }

        const RUNTIME_SUFFIXES = [".Locale", ".Platform", ".Sdk", ".Sdk.Debug", ".Platform.Debug", ".Extension", ".Debug", ".Source"];

        function parseSearchResults(text) {
            const lines = text.split("\n");
            const rows = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line === "No matches found") continue;
                const pieces = line.split(/\s{2,}|\t+/);
                const id = pieces[0];
                if (!id || !id.includes(".")) continue;
                if (RUNTIME_SUFFIXES.some((suffix) => id.endsWith(suffix))) continue;
                rows.push({
                    id: id,
                    name: pieces[1] || id,
                    description: pieces[2] ? pieces.slice(2).join(" ") : ""
                });
            }
            return rows;
        }

        function renderSearchResults(text) {
            searchList.innerHTML = "";
            const results = parseSearchResults(text);
            const filtered = results.filter((app) => !installedApps.some((installed) => installed.id === app.id));
            if (filtered.length === 0) {
                const li = document.createElement("li");
                li.textContent = locale.t("flatpakenv.noresults");
                searchList.appendChild(li);
                return;
            }
            filtered.forEach((app) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#";
                const wrap = document.createElement("div");
                wrap.style.cssText = "flex:1;overflow:hidden;min-width:0";
                const nameSpan = document.createElement("span");
                nameSpan.textContent = app.name;
                const descDiv = document.createElement("div");
                descDiv.style.cssText = "font-size:13px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
                descDiv.textContent = app.description || app.id;
                wrap.appendChild(nameSpan);
                wrap.appendChild(descDiv);
                a.appendChild(wrap);
                li.appendChild(a);
                li.addEventListener("click", (e) => {
                    e.preventDefault();
                    showInstallDialog({ id: app.id, name: app.name });
                });
                searchList.appendChild(li);
            });
        }

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => runSearch(searchInput.value), 400);
        });

        searchInput.addEventListener("search", () => {
            clearTimeout(searchTimeout);
            runSearch(searchInput.value);
        });

        locale.load().then(loadInstalledApps);
    </script>
</body>
</html>
