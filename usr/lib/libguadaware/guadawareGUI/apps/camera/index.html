<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Camera</title>
  <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="camera-header">
    <button id="btn-gallery" aria-label="Gallery">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <h1 id="camera-title" data-locale="camera.title">Camera</h1>
    <button id="btn-flip" aria-label="Flip Camera">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </header>

  <main id="camera-viewport">
    <video id="camera-stream" autoplay playsinline></video>
    <div id="camera-overlay">
      <div id="camera-focus-ring"></div>
    </div>
    <div id="camera-flash"></div>
  </main>

  <footer id="camera-controls">
    <div id="camera-mode-selector">
      <button class="mode-btn active" data-mode="photo" data-locale="camera.photo">Photo</button>
      <button class="mode-btn" data-mode="video" data-locale="camera.video">Video</button>
    </div>
    <div id="camera-buttons">
      <button id="btn-last-photo" aria-label="Last Photo">
        <div id="last-photo-thumb"></div>
      </button>
      <button id="btn-capture" aria-label="Capture">
        <div id="capture-ring">
          <div id="capture-inner"></div>
        </div>
      </button>
      <button id="btn-switch-cam" aria-label="Switch Camera">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16v4a2 2 0 0 1-2 2h-4"/>
          <path d="M14 12l-4-4-4 4"/>
          <path d="M4 8V4a2 2 0 0 1 2-2h4"/>
          <path d="M10 12l4 4 4-4"/>
        </svg>
      </button>
    </div>
  </footer>

  <div id="camera-toast" class="hidden"></div>

  <script src="../../guadawareUniversalFramework/Locale.js"></script>
  <script src="index.js"></script>
</body>
</html>
