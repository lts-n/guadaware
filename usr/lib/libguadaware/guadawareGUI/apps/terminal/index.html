<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Terminal</h1>
    </header>
    <div id="terminal-screen">
        <iframe src="" id="terminal-iframe" frameborder="0"></iframe>
    </div>
    <form id="command-form" autocomplete="off">
        <span id="prompt">$</span>
        <input type="text" id="command-input" placeholder="Enter command" spellcheck="false" autofocus>
        <button id="execute-button" type="submit" aria-label="Run"></button>
    </form>
    <script src="index.js"></script>
</body>
</html>
