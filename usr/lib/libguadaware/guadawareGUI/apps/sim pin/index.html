<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM PIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lock">
        <div class="unlock-label" id="label" data-locale="simpin.enter">Enter SIM PIN</div>
        <div class="dots" id="dots">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i class="puk-dot"></i>
            <i class="puk-dot"></i>
            <i class="puk-dot"></i>
            <i class="puk-dot"></i>
        </div>

        <div class="keypad">
            <div class="row">
                <button data-key="1"><b>1</b></button>
                <button data-key="2"><b>2</b><em>ABC</em></button>
                <button data-key="3"><b>3</b><em>DEF</em></button>
            </div>
            <div class="row">
                <button data-key="4"><b>4</b><em>GHI</em></button>
                <button data-key="5"><b>5</b><em>JKL</em></button>
                <button data-key="6"><b>6</b><em>MNO</em></button>
            </div>
            <div class="row">
                <button data-key="7"><b>7</b><em>PQRS</em></button>
                <button data-key="8"><b>8</b><em>TUV</em></button>
                <button data-key="9"><b>9</b><em>WXYZ</em></button>
            </div>
            <div class="row">
                <button class="alt" id="emergency" data-locale="simpin.emergency">Emergency</button>
                <button data-key="0"><b>0</b></button>
                <button class="alt" id="delete">&#x232B;</button>
            </div>
        </div>
    </div>

    <script src="../../guadawareUniversalFramework/Locale.js"></script>
    <script>
        const locale = new Locale();
        const SYSTEM_API = "http://localhost:8080";
        const PIN_LEN = 4;
        const PUK_LEN = 8;
        const label = document.getElementById("label");
        const dots = [...document.querySelectorAll("#dots i")];

        let mode = "pin";
        let attempt = "";
        let shaking = false;
        let verifying = false;
        let pukAttempts = 0;
        let newPin = "";
        let confirmPin = "";
        let pinStep = "new";

        function goNext() {
            window.location.href = "../lockscreen/";
        }

        function setError(text) {
            label.textContent = text;
            shake();
        }

        function getCodeLen() {
            return mode === "pin" ? PIN_LEN : PUK_LEN;
        }

        function updateDots() {
            const filled = attempt.length;
            const dotsContainer = document.getElementById("dots");
            if (mode === "puk") {
                dotsContainer.classList.add("puk-mode");
            } else {
                dotsContainer.classList.remove("puk-mode");
            }
            dots.forEach((d, i) => d.classList.toggle("filled", i < filled));
        }

        function resetDots() {
            attempt = "";
            updateDots();
        }

        function showPukBlocked() {
            label.textContent = locale.t("simpin.pukblocked");
            dots.forEach((d) => d.style.display = "none");
            document.querySelectorAll(".keypad button").forEach((btn) => {
                btn.disabled = true;
                btn.style.opacity = "0.3";
            });
        }

        function submit() {
            if (verifying) return;
            verifying = true;

            if (mode === "pin") {
                if (attempt.length !== PIN_LEN) {
                    verifying = false;
                    return;
                }
                fetch(`${SYSTEM_API}/postSIM-PIN/${attempt}`)
                    .then((res) => res.text())
                    .then((result) => {
                        result = result.trim();
                        if (result === "no-modem" || result === "no-sim") {
                            goNext();
                        } else if (result === "ok") {
                            label.textContent = locale.t("simpin.success");
                            dots.forEach((d) => d.classList.add("filled"));
                            setTimeout(goNext, 300);
                        } else if (result === "puk-required") {
                            mode = "puk";
                            attempt = "";
                            pukAttempts = 0;
                            label.textContent = locale.t("simpin.enterpuk");
                            updateDots();
                        } else {
                            label.textContent = locale.t("simpin.wrong");
                            setTimeout(() => shake(), 0);
                        }
                        verifying = false;
                    })
                    .catch(() => {
                        goNext();
                        verifying = false;
                    });
            } else if (mode === "puk") {
                if (attempt.length !== PUK_LEN) {
                    verifying = false;
                    return;
                }
                window._lastPuk = attempt;
                attempt = "";
                mode = "puk-pin";
                pinStep = "new";
                label.textContent = locale.t("simpin.newpin");
                updateDots();
                verifying = false;
            } else if (mode === "puk-pin") {
                if (pinStep === "new") {
                    if (attempt.length !== PIN_LEN) {
                        verifying = false;
                        return;
                    }
                    newPin = attempt;
                    attempt = "";
                    pinStep = "confirm";
                    label.textContent = locale.t("simpin.confirmnewpin");
                    updateDots();
                    verifying = false;
                } else if (pinStep === "confirm") {
                    if (attempt.length !== PIN_LEN) {
                        verifying = false;
                        return;
                    }
                    confirmPin = attempt;
                    if (newPin !== confirmPin) {
                        label.textContent = locale.t("simpin.pinmismatch");
                        newPin = "";
                        confirmPin = "";
                        attempt = "";
                        pinStep = "new";
                        label.textContent = locale.t("simpin.newpin");
                        setTimeout(() => shake(), 0);
                        verifying = false;
                        return;
                    }
                    const lastPuk = window._lastPuk || "";
                    fetch(`${SYSTEM_API}/postSIM-PUK/${lastPuk}/${newPin}`)
                        .then((res) => res.text())
                        .then((result) => {
                            result = result.trim();
                            if (result === "ok") {
                                label.textContent = locale.t("simpin.success");
                                dots.forEach((d) => d.classList.add("filled"));
                                setTimeout(goNext, 300);
                            } else if (result === "puk-wrong") {
                                pukAttempts++;
                                if (pukAttempts >= 3) {
                                    showPukBlocked();
                                } else {
                                    const remaining = 3 - pukAttempts;
                                    label.textContent = `${locale.t("simpin.pukwrong")} (${remaining} ${locale.t("simpin.pukremaining")})`;
                                    mode = "puk";
                                    attempt = "";
                                    setTimeout(() => shake(), 0);
                                }
                            } else if (result === "puk-blocked") {
                                showPukBlocked();
                            } else {
                                label.textContent = locale.t("simpin.wrong");
                                setTimeout(() => shake(), 0);
                            }
                            verifying = false;
                        })
                        .catch(() => {
                            goNext();
                            verifying = false;
                        });
                }
            }
        }

        function shake(cb) {
            if (shaking) return;
            shaking = true;
            const holder = document.getElementById("dots");
            holder.addEventListener("animationend", () => {
                holder.classList.remove("shake");
                attempt = "";
                updateDots();
                if (mode === "pin") {
                    label.textContent = locale.t("simpin.enter");
                } else if (mode === "puk") {
                    label.textContent = locale.t("simpin.enterpuk");
                } else if (mode === "puk-pin") {
                    if (pinStep === "new") {
                        label.textContent = locale.t("simpin.newpin");
                    } else {
                        label.textContent = locale.t("simpin.confirmnewpin");
                    }
                }
                shaking = false;
                if (cb) cb();
            }, { once: true });
            holder.classList.add("shake");
        }

        function press(key) {
            if (shaking) return;
            const maxLen = getCodeLen();
            if (attempt.length < maxLen) {
                attempt += key;
                updateDots();
            }
            if (attempt.length === maxLen) {
                setTimeout(submit, 120);
            }
        }

        document.querySelectorAll(".keypad button[data-key]").forEach((btn) => {
            btn.addEventListener("click", () => press(btn.dataset.key));
        });

        document.getElementById("delete").addEventListener("click", () => {
            if (shaking) return;
            attempt = attempt.slice(0, -1);
            updateDots();
        });

        document.getElementById("emergency").addEventListener("click", () => {
            fetch(`${SYSTEM_API}/makeCall/112`).catch(() => {});
        });

        fetch(`${SYSTEM_API}/getSIMStatus`)
            .then((res) => res.text())
            .then((status) => {
                status = status.trim();
                if (status === "no-modem" || status === "no-sim") {
                    goNext();
                } else if (status === "enabled" || status === "registered") {
                    goNext();
                } else {
                    return fetch(`${SYSTEM_API}/getSIMPinStatus`);
                }
            })
            .then((res) => res ? res.text() : null)
            .then((pinStatus) => {
                if (!pinStatus) return;
                pinStatus = pinStatus.trim();
                if (pinStatus === "unlocked") {
                    goNext();
                } else if (pinStatus === "puk-blocked") {
                    mode = "puk";
                    label.textContent = locale.t("simpin.enterpuk");
                    dots.forEach((d) => d.style.display = "");
                    updateDots();
                } else if (pinStatus === "pin-required") {
                    mode = "pin";
                    label.textContent = locale.t("simpin.enter");
                    dots.forEach((d) => d.style.display = "");
                    updateDots();
                }
            })
            .catch(goNext);
    </script>
</body>
</html>
