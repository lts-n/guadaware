<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Guadaware</title>
    <link rel="stylesheet" href="../../guadawareUniversalFramework/style.css">
</head>
<body>
    <header>
        <span><a href="index.html" data-locale="settings.back">Back</a></span>
        <span><h1>Guadaware 26 Beta</h1></span>

    </header>
    <section>
        <ul>
            <li>
                <span data-locale="about.model">Guadafón Model</span>
                <b id="pc-model">—</b>
            </li>
        </ul>
    </section>
    <section>
        <ul>
            <li>
                <span data-locale="about.ram">RAM</span>
                <b id="ram-usage">—</b>
            </li>
            <li>
                <span data-locale="about.storage">Storage</span>
                <b id="disk-usage">—</b>
            </li>
        </ul>
    </section>
    <section>
        <ul>
            <li>
                <span data-locale="about.cpu">CPU Model</span>
                <b id="cpu-model">—</b>
            </li>
            <li>
                <span data-locale="about.gpu">GPU Model</span>
                <b id="gpu-model">—</b>
            </li>
        </ul>
    </section>

    <script src="../../guadawareUniversalFramework/Locale.js"></script>
    <script>
      const locale = new Locale();
      const SYSTEM_API = "http://localhost:8080";

      async function fill(id, endpoint) {
        const el = document.getElementById(id);
        try {
          const res = await fetch(SYSTEM_API + endpoint);
          el.textContent = (await res.text()).trim() || "—";
        } catch {
          el.textContent = locale.t("about.unavailable");
        }
      }

      fill("pc-model", "/getPCModel");
      fill("ram-usage", "/getRAMUsage");
      fill("disk-usage", "/getDiskUsage");
      fill("cpu-model", "/getCPUModel");
      fill("gpu-model", "/getGPUModel");
    </script>
</body>
</html>
